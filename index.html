<script>
    // 腾讯文档配置 - 使用您的文档ID
    const TENCENT_SHEET_ID = '【腾讯文档】型号
https://docs.qq.com/sheet/DVnZ0ZW53VkRjeUJ6?tab=BB08J2';
    
    // 备用数据
    const backupPhoneData = [
        { name: "苹果15(3092)-128G粉", price: 3800, sku: "LE3-9K3", brand: "苹果" },
        { name: "苹果15(3092)-128G蓝", price: 3760, sku: "LG3-9M3", brand: "苹果" },
        { name: "苹果15(3092)-128G黑", price: 3760, sku: "LD3-9J3", brand: "苹果" }
    ];

    // 初始化页面
    document.addEventListener('DOMContentLoaded', function() {
        // 先显示备用数据
        displayPhones(backupPhoneData);
        document.getElementById('update-time').innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> 正在尝试连接腾讯文档...';
        
        // 然后尝试加载腾讯文档数据
        setTimeout(loadPriceFromTencent, 1000);
        setupEventListeners();
    });

    // 从腾讯文档加载价格数据 - 简化版本
    async function loadPriceFromTencent() {
        try {
            // 方法1：尝试直接访问
            await tryDirectAccess();
            
        } catch (error) {
            console.log('方法1失败，尝试方法2:', error);
            try {
                // 方法2：使用图片方式触发加载
                await tryImageMethod();
            } catch (error2) {
                console.log('所有方法都失败，使用备用数据:', error2);
                document.getElementById('update-time').innerHTML = '<i class="fas fa-exclamation-triangle"></i> 最后更新: ' + new Date().toLocaleString() + ' (本地数据)';
            }
        }
    }

    // 方法1：直接访问
    async function tryDirectAccess() {
        const url = `https://docs.qq.com/dop-api/opendoc?id=${TENCENT_SHEET_ID}`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error('直接访问失败');
        
        const text = await response.text();
        if (!text.includes('手机型号')) {
            throw new Error('未找到数据');
        }
        
        // 简单解析HTML中的表格数据
        const phones = parseHTMLTable(text);
        if (phones.length > 0) {
            displayPhones(phones);
            document.getElementById('update-time').innerHTML = '<i class="fas fa-check"></i> 最后更新: ' + new Date().toLocaleString();
        } else {
            throw new Error('解析失败');
        }
    }

    // 方法2：图片方式
    async function tryImageMethod() {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = function() {
                // 图片加载成功，但无法获取数据
                reject(new Error('图片方式无法获取数据'));
            };
            img.onerror = function() {
                reject(new Error('图片加载失败'));
            };
            img.src = `https://docs.qq.com/dop-api/opendoc?id=${TENCENT_SHEET_ID}`;
        });
    }

    // 解析HTML表格数据
    function parseHTMLTable(html) {
        const phones = [];
        try {
            // 简单的表格解析逻辑
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            // 这里需要根据实际HTML结构调整
            // 暂时返回空数组，使用备用数据
            return phones;
            
        } catch (error) {
            console.error('HTML解析错误:', error);
            return phones;
        }
    }

    // 显示手机列表
    function displayPhones(phones) {
        const resultsContainer = document.getElementById('phone-results');
        
        if (!phones || phones.length === 0) {
            resultsContainer.innerHTML = '<div class="error">暂无报价数据</div>';
            return;
        }
        
        let html = '';
        phones.forEach(phone => {
            html += `
                <div class="phone-card" data-brand="${phone.brand || '其他'}">
                    <div class="phone-info">
                        <div class="phone-name">
                            ${phone.name}
                            ${phone.tag ? `<span class="damage-tag">${phone.tag}</span>` : ''}
                        </div>
                        <div class="phone-sku">${phone.sku || '暂无SKU'}</div>
                    </div>
                    <div class="phone-price">¥${phone.price}</div>
                </div>
            `;
        });
        
        resultsContainer.innerHTML = html;
    }

    // 搜索功能
    function performSearch() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
        const phoneCards = document.querySelectorAll('.phone-card');
        const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
        
        let visibleCount = 0;
        
        phoneCards.forEach(card => {
            const text = card.textContent.toLowerCase();
            const brand = card.dataset.brand;
            
            const matchesSearch = searchTerm === '' || text.includes(searchTerm);
            const matchesFilter = activeFilter === 'all' || brand === activeFilter;
            
            if (matchesSearch && matchesFilter) {
                card.style.display = 'flex';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });
    }

    // 设置事件监听器
    function setupEventListeners() {
        document.getElementById('search-btn').addEventListener('click', performSearch);
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                performSearch();
            });
        });
    }
</script>
