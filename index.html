<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机报价 - 每日更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .update-info {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .search-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .phone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .phone-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .phone-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }
        
        .phone-card.hot::before {
            content: "🔥 热销";
            position: absolute;
            top: 10px;
            right: -25px;
            background: #ff4757;
            color: white;
            padding: 4px 30px;
            font-size: 12px;
            transform: rotate(45deg);
        }
        
        .phone-image {
            text-align: center;
            font-size: 48px;
            margin-bottom: 15px;
            color: #2f3542;
        }
        
        .phone-model {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2f3542;
        }
        
        .phone-storage {
            color: #747d8c;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        
        .phone-price {
            font-size: 1.8em;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 8px;
        }
        
        .price-change {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .price-up {
            background: #ffcccc;
            color: #ff4757;
        }
        
        .price-down {
            background: #ccffcc;
            color: #2ed573;
        }
        
        .price-stable {
            background: #f1f2f6;
            color: #747d8c;
        }
        
        .phone-status {
            margin-top: 10px;
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        
        .in-stock {
            background: #ccffcc;
            color: #2ed573;
        }
        
        .out-stock {
            background: #ffcccc;
            color: #ff4757;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
            grid-column: 1 / -1;
        }
        
        .error-message {
            text-align: center;
            padding: 40px;
            color: white;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            grid-column: 1 / -1;
        }
        
        .success-message {
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #2ed573;
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 40px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .phone-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .update-info {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 每日手机报价</h1>
            <div class="subtitle">价格每日更新 · 全网比价 · 实时行情</div>
        </div>

        <div class="success-message">
            <p><strong>✓ 已连接至 Google Sheets</strong> - 在表格中修改价格后刷新页面即可更新</p>
        </div>
        
        <div class="update-info">
            <div>最后更新: <span id="updateTime">加载中...</span></div>
            <button class="refresh-btn" onclick="priceManager.loadData()">🔄 刷新价格</button>
        </div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索手机型号..." onkeyup="priceManager.filterProducts()">
        </div>
        
        <div class="phone-grid" id="phoneGrid">
            <div class="loading">正在从 Google Sheets 加载最新报价...</div>
        </div>
        
        <footer>
            <p>手机报价系统 &copy; 2024</p>
            <p>数据来源: Google Sheets - 实时同步</p>
        </footer>
    </div>

    <script>
        // 手机价格管理器 - 使用 CSV 链接动态获取数据
        class PriceManager {
            constructor() {
                // 使用你提供的 CSV 链接
                this.csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvXbm5kD_vT11nLjJf42Sk3kX3dWySW64331nYnRFp5cQI6tP3JKWx-5XKsPHLWOS3TTnf7nJL47CB/pub?output=csv';
                this.phones = [];
                this.filteredPhones = [];
                this.init();
            }
            
            init() {
                this.loadData();
                // 每30分钟自动更新一次
                setInterval(() => this.loadData(), 30 * 60 * 1000);
            }
            
            async loadData() {
                try {
                    this.showLoading();
                    
                    console.log('正在从 Google Sheets 获取数据...');
                    
                    // 添加时间戳参数避免缓存
                    const url = this.csvUrl + '&t=' + Date.now();
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error('网络请求失败: ' + response.status);
                    }
                    
                    const csvText = await response.text();
                    console.log('获取到的 CSV 数据:', csvText);
                    
                    if (!csvText || csvText.trim() === '') {
                        throw new Error('CSV 数据为空');
                    }
                    
                    this.parseCSVData(csvText);
                    this.render();
                    this.updateLocalStorage();
                    
                } catch (error) {
                    console.error('获取价格失败:', error);
                    this.showError('获取价格失败: ' + error.message + '，使用缓存数据');
                    this.useCachedData();
                }
            }
            
            parseCSVData(csvText) {
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                this.phones = [];
                
                console.log('CSV 行数:', lines.length);
                
                // 从第一行开始解析数据（跳过空行）
                for (let i = 0; i < lines.length; i++) {
                    const cells = lines[i].split(',');
                    
                    // 跳过表头（如果第一行包含"型号"等表头文字）
                    if (i === 0 && (cells[0].includes('型号') || cells[0].includes('model'))) {
                        continue;
                    }
                    
                    if (cells.length >= 3) {
                        const phone = {
                            model: cells[0]?.trim() || '',
                            storage: cells[1]?.trim() || '',
                            price: this.parsePrice(cells[2]),
                            change: cells[3] ? this.parseChange(cells[3]) : 0,
                            status: cells[4] ? cells[4].trim() : '有货',
                            isHot: cells[5] ? this.parseHotStatus(cells[5]) : false
                        };
                        
                        console.log('解析出的手机数据:', phone);
                        
                        // 只添加有有效数据的行
                        if (phone.model && phone.price > 0) {
                            this.phones.push(phone);
                        }
                    }
                }
                
                this.filteredPhones = [...this.phones];
                console.log('最终手机数据:', this.phones);
            }
            
            parsePrice(priceText) {
                if (!priceText) return 0;
                // 提取数字，移除货币符号等非数字字符
                const match = priceText.toString().match(/(\d+(\.\d+)?)/);
                return match ? parseFloat(match[1]) : 0;
            }
            
            parseChange(changeText) {
                if (!changeText) return 0;
                
                const text = changeText.toString().trim();
                
                // 解析价格变化，支持 ↑100, ↓200, 平 等格式
                if (text.includes('↑')) {
                    return parseInt(text.replace('↑', '')) || 0;
                } else if (text.includes('↓')) {
                    return -parseInt(text.replace('↓', '')) || 0;
                } else if (text === '平' || text === '持平') {
                    return 0;
                }
                
                // 直接尝试解析数字
                const num = parseInt(text);
                return isNaN(num) ? 0 : num;
            }
            
            parseHotStatus(statusText) {
                if (!statusText) return false;
                const text = statusText.toString().trim().toLowerCase();
                return text === '是' || text === 'yes' || text === 'true' || text === '热销';
            }
            
            render() {
                const grid = document.getElementById('phoneGrid');
                
                if (this.filteredPhones.length === 0) {
                    grid.innerHTML = '<div class="error-message">暂无手机数据，请检查表格格式或添加数据</div>';
                    return;
                }
                
                grid.innerHTML = this.filteredPhones.map(phone => `
                    <div class="phone-card ${phone.isHot ? 'hot' : ''}">
                        <div class="phone-image">📱</div>
                        <div class="phone-model">${phone.model}</div>
                        <div class="phone-storage">${phone.storage}</div>
                        <div class="phone-price">¥${phone.price}</div>
                        <div class="price-change ${this.getChangeClass(phone.change)}">
                            ${this.getChangeText(phone.change)}
                        </div>
                        <div class="phone-status ${phone.status === '有货' ? 'in-stock' : 'out-stock'}">
                            ${phone.status}
                        </div>
                    </div>
                `).join('');
                
                // 更新显示时间
                document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
            }
            
            getChangeClass(change) {
                if (change > 0) return 'price-up';
                if (change < 0) return 'price-down';
                return 'price-stable';
            }
            
            getChangeText(change) {
                if (change > 0) return `↑${change}`;
                if (change < 0) return `↓${Math.abs(change)}`;
                return '持平';
            }
            
            filterProducts() {
                const searchText = document.getElementById('searchInput').value.toLowerCase();
                
                if (!searchText) {
                    this.filteredPhones = [...this.phones];
                } else {
                    this.filteredPhones = this.phones.filter(phone => 
                        phone.model.toLowerCase().includes(searchText) ||
                        phone.storage.toLowerCase().includes(searchText)
                    );
                }
                
                this.render();
            }
            
            showLoading() {
                const grid = document.getElementById('phoneGrid');
                grid.innerHTML = '<div class="loading">正在从 Google Sheets 加载最新报价...</div>';
            }
            
            showError(message) {
                const grid = document.getElementById('phoneGrid');
                grid.innerHTML = `<div class="error-message">${message}</div>`;
            }
            
            updateLocalStorage() {
                localStorage.setItem('phonePrices', JSON.stringify({
                    data: this.phones,
                    timestamp: Date.now()
                }));
            }
            
            useCachedData() {
                const cached = localStorage.getItem('phonePrices');
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    this.phones = data;
                    this.filteredPhones = [...data];
                    this.render();
                    
                    const time = new Date(timestamp).toLocaleString('zh-CN');
                    document.getElementById('updateTime').textContent = `${time} (缓存)`;
                } else {
                    // 如果没有缓存数据，显示示例数据
                    this.showExampleData();
                }
            }
            
            showExampleData() {
                this.phones = [
                    { model: "iPhone 15", storage: "128G", price: 5999, change: -200, status: "有货", isHot: true },
                    { model: "iPhone 15", storage: "256G", price: 6999, change: 100, status: "有货", isHot: true },
                    { model: "小米14", storage: "256G", price: 4599, change: 0, status: "有货", isHot: true }
                ];
                this.filteredPhones = [...this.phones];
                this.render();
                
                document.getElementById('updateTime').textContent = '示例数据 - 请检查表格链接和数据';
            }
        }
        
        // 创建全局实例
        const priceManager = new PriceManager();
    </script>
</body>
</html>
