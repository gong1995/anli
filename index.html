<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机操作系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
            color: #333;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }
        .app-card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1); 
            overflow: hidden;
        }
        header { 
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); 
            color: white; 
            padding: 25px; 
            text-align: center;
        }
        header h1 { 
            font-size: 28px; 
            margin-bottom: 8px; 
            font-weight: 600;
        }
        .update_info { 
            font-size: 14px; 
            opacity: 0.9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
        }
        .search-section { 
            padding: 25px; 
            border-bottom: 1px solid #f0f0f0; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-card">
            <header>
                <h1>手机操作系统</h1>
                <div class="update_info">
                    <i class="fas fa-sync-alt"></i>
                    <span>最后更新: 2024年</span>
                </div>
            </header>
            <div class="search-section">
                <!-- 搜索区域内容 -->
                <p>页面内容正在开发中...</p>
            </div>
        </div>
    </div>
</body>
</html>
